command_received:
  target:
    entity:
      integration: espsomfy_rts_companion
      domain: cover
  fields:
    command:
      selector:
        select:
          translation_key: command
          options:
            - up
            - down
            - my
            - stop
            - my_up
            - my_down
            - up_down
            - my_up_down
            - step_up
            - step_down
            - prog
            - sun_flag
            - flag
            - toggle
            - favorite
            - sensor
    source:
      selector:
        select:
          translation_key: command_source
          options:
            - remote
            - group
            - internal
            - home_assistant
    remote_address:
      selector:
        number:
          min: 0
          mode: box
    once_per_press:
      default: false
      selector:
        boolean:
