<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A6FDB"/><stop offset="1" stop-color="#1A4FA8"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- window frame -->
  <rect x="112" y="128" width="288" height="288" rx="22" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  <!-- shutter slats, half closed -->
  <g fill="#FFFFFF">
    <rect x="134" y="152" width="244" height="30" rx="8"/>
    <rect x="134" y="194" width="244" height="30" rx="8"/>
    <rect x="134" y="236" width="244" height="30" rx="8" opacity="0.92"/>
  </g>
  <!-- light through the open part -->
  <rect x="134" y="282" width="244" height="112" rx="10" fill="#FFFFFF" opacity="0.14"/>
  <!-- My star -->
  <path d="M256 300 l13.2 26.8 29.6 4.3 -21.4 20.9 5 29.5 -26.4 -13.9 -26.4 13.9 5 -29.5 -21.4 -20.9 29.6 -4.3z" fill="#FFD54A"/>
  <!-- RTS radio waves -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="18">
    <path d="M372 92 a44 44 0 0 1 48 48" opacity="0.95"/>
    <path d="M372 52 a84 84 0 0 1 88 88" opacity="0.6"/>
